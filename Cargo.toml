[package]
name = "micstudio"
version = "0.1.0"
edition = "2024"
authors = ["Kumar Manisk <mathewmanisk699@gmail.com>"]
description = "High-performance native Rust audio studio, voice preset manager, and real-time DSP pipeline for PipeWire"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kmanisk/micstudio"
homepage = "https://github.com/kmanisk/micstudio"
documentation = "https://docs.rs/micstudio"
readme = "README.md"
keywords = ["audio", "pipewire", "dsp", "tui", "voice"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = [
    "assets/*",
]

[dependencies]
hound = "3.5.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
libc = "0.2.190"
libspa = "0.10.1"
libspa-sys = "0.10.1"
nnnoiseless = "0.5.2"
pipewire = { version = "0.10.1", features = ["v0_3_49"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"
unicode-width = "0.2"
